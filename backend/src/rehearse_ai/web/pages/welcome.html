<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer"><title>RehearseAI — Your interview</title>
  <link rel="stylesheet" href="/assets/styles/theme.css?v=__BUILD_ID__">
  <link rel="stylesheet" href="/assets/styles/pages.css?v=__BUILD_ID__">
</head><body><main class="account-shell">
  <header><span class="brand">RehearseAI</span><p>Candidate interview</p></header>
  <section class="account-card"><h1 id="welcome-title">Your interview</h1>
    <p id="welcome-detail" class="muted">Loading your invitation…</p>
    <p id="message" role="alert" hidden></p>
    <form id="name-form"><label for="full-name">Your full name</label>
      <input id="full-name" type="text" autocomplete="name" maxlength="120" required>
      <button class="primary" type="submit">Confirm name and continue</button></form>
    <a id="setup-link" class="primary button" href="/interview" hidden>Continue to device checks</a>
  </section><p class="fineprint">Your name is self-reported and is not identity verification. Camera, microphone, and screen checks occur before Begin.</p>
</main><script src="/assets/scripts/candidate/invitation.js?v=__BUILD_ID__" defer></script></body></html>
