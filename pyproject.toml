[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rehearse-ai"
version = "0.1.0"
description = "RehearseAI candidate interview platform with a Pipecat voice interview"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=4,<5",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi-users[sqlalchemy]>=15,<16",
    "itsdangerous>=2.2,<3",
    "pipecat-ai[cartesia,deepgram,openai,runner,webrtc]==1.14.0",
    "pillow>=12,<14",
    "reportlab>=4.4,<5",
]

[dependency-groups]
dev = [
    "pypdf>=6,<7",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rehearse_ai = ["prompts/*.txt", "web/*.html", "web/*.css", "web/*.js", "fonts/*.ttf", "fonts/OFL.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
