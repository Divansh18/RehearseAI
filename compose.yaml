services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rehearse
      POSTGRES_PASSWORD: rehearse_local_only
      POSTGRES_DB: rehearse_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rehearse_postgres:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehearse -d rehearse_dev"]
      interval: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  rehearse_postgres:
