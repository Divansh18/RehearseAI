<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>RehearseAI — Interview record</title>
  <link rel="stylesheet" href="/assets/account.css?v=__BUILD_ID__">
</head>
<body>
  <main class="dashboard-shell">
    <header class="dashboard-header"><div><a class="brand" href="/dashboard">RehearseAI</a><p>Interview conversation</p></div><button id="logout" type="button">Log out</button></header>
    <div class="dashboard-title"><h1>Interview record</h1><p id="record-date">Loading…</p><p id="record-status"></p><p id="record-candidate"></p></div>
    <section class="account-card">
      <h2>Transcript</h2>
      <p class="muted">Candidate speech is machine transcription. Assistant output status reflects server events, not confirmed browser playback.</p>
      <div id="conversation" class="conversation-list"></div>
    </section>
    <p id="message" role="alert" hidden></p>
  </main>
  <script src="/assets/history.js?v=__BUILD_ID__" defer></script>
</body>
</html>
