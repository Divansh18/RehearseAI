<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>RehearseAI — Administrator sign in</title>
  <link rel="stylesheet" href="/assets/styles/theme.css?v=__BUILD_ID__">
  <link rel="stylesheet" href="/assets/styles/pages.css?v=__BUILD_ID__">
</head>
<body>
  <main class="account-shell">
    <header><a class="brand" href="/">RehearseAI</a><p>Interview administration</p></header>
    <section class="account-card" aria-labelledby="title">
      <h1 id="title">Administrator sign in</h1>
      <p id="intro" class="muted"></p>
      <p id="message" role="status" aria-live="polite" hidden></p>
      <form id="account-form" autocomplete="on">
        <label id="email-label" for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label id="password-label" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit" class="primary" type="submit">Continue</button>
      </form>
      <nav class="auth-nav" aria-label="Account options">
        <a href="/login">Sign in</a>
        <button id="forgot" type="button">Forgot password?</button>
      </nav>
    </section>
    <p class="fineprint">Candidate access is by private invitation. Local development captures administrator password-reset mail in Mailpit.</p>
  </main>
  <script src="/assets/scripts/admin/sign_in.js?v=__BUILD_ID__" defer></script>
</body>
</html>
