<!doctype html><html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer"><title>RehearseAI — Interview blueprints</title>
  <link rel="stylesheet" href="/assets/theme.css?v=__BUILD_ID__">
  <link rel="stylesheet" href="/assets/account.css?v=__BUILD_ID__">
</head><body><main class="dashboard-shell">
  <header class="dashboard-header"><div><a class="brand" href="/admin/interviews">RehearseAI</a><p>Admin workspace</p></div>
    <nav class="header-actions" aria-label="Main navigation"><div class="top-nav"><a href="/admin/interviews">Records</a><a href="/admin/blueprints" aria-current="page">Blueprints</a><a href="/admin/assignments">Assignments</a></div><button id="logout" class="secondary" type="button">Log out</button></nav></header>
  <div class="dashboard-title"><div><span class="eyebrow">Interview design</span><h1>Blueprints</h1><p>Write and preview questions before publishing an immutable version.</p></div></div>
  <p id="message" role="alert" hidden></p>
  <section class="account-card"><h2>Draft blueprint</h2>
    <form id="blueprint-form"><input id="blueprint-id" type="hidden">
      <label for="title">Interview title</label><input id="title" maxlength="120" required>
      <label for="purpose">Purpose</label><textarea id="purpose" maxlength="500" required></textarea>
      <label for="focus-areas">Focus areas, one per line</label><textarea id="focus-areas"></textarea>
      <label for="target-minutes">Estimated duration (minutes)</label><input id="target-minutes" type="number" min="5" max="120" value="30" required>
      <label for="interviewer-style">Interviewer style</label><textarea id="interviewer-style" maxlength="500" required></textarea>
      <label for="closing-instructions">Closing instructions</label><textarea id="closing-instructions" maxlength="500" required></textarea>
      <h3>Ordered questions</h3><div id="question-editor"></div>
      <button id="add-question" class="secondary" type="button">Add question</button>
      <div class="setup-actions"><button class="primary" type="submit">Save draft</button><button id="preview" class="secondary" type="button">Preview</button><button id="publish" class="secondary" type="button" disabled>Publish saved draft</button></div>
    </form><div id="blueprint-preview" class="account-card" hidden></div>
  </section>
  <section class="account-card pdf-card"><h2>Existing drafts</h2><div id="blueprint-list" class="record-list"></div></section>
</main><script src="/assets/admin_setup.js?v=__BUILD_ID__" defer></script></body></html>
